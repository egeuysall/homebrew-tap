name: Update formulas

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-formulas
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Update formulas
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ruby scripts/update-formulas.rb

      - name: Check formulas
        run: |
          brew style --fix Formula/*.rb
          brew style Formula/*.rb
          brew audit --new --tap egeuysall/tap
          for formula in bri ibx zap; do
            brew install --build-from-source "./Formula/${formula}.rb"
            brew test "${formula}"
            brew uninstall --force "${formula}"
          done

      - name: Commit updates
        run: |
          git add Formula
          if git diff --cached --quiet -- Formula; then
            echo "formulas are current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Homebrew formulas"
          git push
